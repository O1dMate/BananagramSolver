<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Bananagrams Solver</title>
		<script src="js/p5/p5.js"></script>
		<script src="js/scripts.js"></script>

		<style>
			ul, li {
				margin: 0;
				color: #bfbfbf;
				font-family: SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
			}

			.cursor-pointer {
				cursor: pointer;
			}

			.label {
				color: #bfbfbf;
				font-size: 24;
				font-family: SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
				white-space: pre-wrap;
			}
			.label-small {
				color: #bfbfbf;
				font-size: 16;
				font-family: SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
				white-space: pre-wrap;
			}

			.textArea {
				width: 100%;
				color: #bfbfbf;
				background-color: #444444;
				border-block-color: #444444;
				resize: none;
				outline: none;
				border: none;
				border-radius: 6px;
				padding: 1rem;
				margin-right: 1rem;
				font-family: SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
				white-space: pre-wrap;
			}

			.buttonStyle {
				cursor: pointer;
				border: none;
				border-radius: 3px;
				color: #bfbfbf;
				margin-top: 1rem;
				font-size: 24;
				background-color: #0072B5;
			}

			.buttonStyle:hover {
				box-shadow: 0px 0px 15px 5px rgb(0, 114, 181);
			}
		</style>

		<style>
			/* Source for Slider CSS: https://www.w3schools.com/howto/howto_js_rangeslider.asp */
			.slider {
				-webkit-appearance: none;
				width: 100%;
				height: 15px;
				border-radius: 5px;
				background: #d3d3d3;
				outline: none;
				opacity: 0.7;
				-webkit-transition: .2s;
				transition: opacity .2s;
			}

			.slider:hover {
				opacity: 1;
			}

			.slider::-webkit-slider-thumb {
				-webkit-appearance: none;
				appearance: none;
				width: 25px;
				height: 25px;
				border-radius: 50%;
				background: #0042FF;
				cursor: pointer;
			}

			.slider::-moz-range-thumb {
				width: 25px;
				height: 25px;
				border-radius: 50%;
				background: #0042FF;
				cursor: pointer;
			}

			/* Source for Checkbox CSS: https://www.w3schools.com/howto/howto_css_custom_checkbox.asp */
			/* The container */
			.checkbox_container {
				display: block;
				position: relative;
				padding-left: 35px;
				margin-bottom: 0px;
				cursor: pointer;
				-webkit-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
				user-select: none;
			}

			/* Hide the browser's default checkbox */
			.checkbox_container input {
				position: absolute;
				opacity: 0;
				cursor: pointer;
				height: 0;
				width: 0;
			}

			/* Create a custom checkbox */
			.checkmark {
				position: absolute;
				top: 0;
				left: 0;
				height: 25px;
				width: 25px;
				background-color: #eee;
			}

			/* On mouse-over, add a grey background color */
			.checkbox_container:hover input ~ .checkmark {
				background-color: #ccc;
			}

			/* When the checkbox is checked, add a blue background */
			.checkbox_container input:checked ~ .checkmark {
				background-color: #2196F3;
			}

			/* Create the checkmark/indicator (hidden when not checked) */
			.checkmark:after {
				content: "";
				position: absolute;
				display: none;
			}

			/* Show the checkmark when checked */
			.checkbox_container input:checked ~ .checkmark:after {
				display: block;
			}

			/* Style the checkmark/indicator - the tick */
			.checkbox_container .checkmark:after {
				left: 9px;
				top: 5px;
				width: 5px;
				height: 10px;
				border: solid white;
				border-width: 0 3px 3px 0;
				-webkit-transform: rotate(45deg);
				-ms-transform: rotate(45deg);
				transform: rotate(45deg);
			}
		</style>
	</head>

	<body style="background-color: #1d1d1d">
		<div style="padding:0.5rem">
			<label class="label">Letters</label>
			<textarea id="letters" class="textArea" spellcheck="false" rows="1"></textarea>

			<label class="label">Temperature: <span id="temperature_value"></span></label>
			<input type="range" min="0.0" max="1.0" value="0.0" step="0.001" class="slider" id="temperature" oninput="HandleTemperatureChange()">
			<ul>
				<li>Add an element of randomness to the solver to give different solutions. 0.0 = No randomness, 1.0 = Max randomness. Note, temperatures values above 0.0 can result in missed solutions.</li>
			</ul>

			<label class="checkbox_container" onclick="HandleStartWithLongestWord()">
				<label class="label">Start with Longest Word</label>
				<input type="checkbox" id="start_with_longest_word">
				<span class="checkmark"></span>
			</label>

			<label class="checkbox_container" onclick="HandleStartWithSpecificWord()">
				<input type="checkbox" id="start_with_specific_word">
				<span class="checkmark"></span>
				<div style="display: flex; flex-direction: column;">
					<label class="label">Start with Specific Word</label>
					<textarea id="required_word" class="textArea" spellcheck="false" rows="1"></textarea>
				</div>
			</label>

			<label class="checkbox_container" onclick="HandleDeepSearch()">
				<label class="label">Use Deep Search</label>
				<label class="label-small">(this is only recommended for small letter lists when normal search is failing)</label>
				<input type="checkbox" id="use_deep_search">
				<span class="checkmark"></span>
			</label>

			<button type="button" class="cursor-pointer buttonStyle" onclick="StartSolve()">Solve</button> 
			<button type="button" class="cursor-pointer buttonStyle" onclick="CancelSolve()">Stop</button> 
		</div>
	</body>
</html>
